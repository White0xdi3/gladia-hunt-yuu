name: Senior Hunter - Analyst Pipeline
on:
  schedule:
    # Offset from reposcan (*/15) and triage (23,53) to spread load.
    # NOTE: intentionally NOT triggered on push -- reposcan/triage/this
    # workflow's own aggregate job all auto-commit every cycle, and a push
    # trigger here previously caused a self-retriggering cascade (3 runs
    # 4 seconds apart on 2026-08-31) that got fixed by removing the trigger
    # entirely -- which silently left this workflow with NOTHING dispatching
    # it for 26 days. Schedule is the safe replacement.
    - cron: "10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write

env:
  PROBE_ALLOW: "gladia"

jobs:
  analyst:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: hunt-${{ matrix.model.name }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        model:
          - { id: opencode/nemotron-3-ultra-free, name: mimo }

    env:
      MODEL_ID: opencode/nemotron-3-ultra-free
      OPENCODE_REASONING: xhigh
      MODEL_NAME: ${{ matrix.model.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install OpenCode
        run: |
          export PATH="$HOME/.opencode/bin:$HOME/.local/bin:$HOME/.npm-global/bin:$PATH"
          if command -v opencode >/dev/null 2>&1; then
            opencode --version
            exit 0
          fi
          npm install -g opencode-ai 2>/dev/null || npm install -g --prefix "$HOME/.npm-global" opencode-ai 2>/dev/null || true
          if ! command -v opencode >/dev/null 2>&1; then
            for i in 1 2 3; do
              curl -fsSL https://opencode.ai/install | bash && break
              echo "opencode.ai installer attempt $i failed, retrying in 15s..."
              sleep 15
            done
          fi
          export PATH="$HOME/.opencode/bin:$HOME/.local/bin:$HOME/.npm-global/bin:$PATH"
          opencode --version


      - name: Prepare context (RAG + state + inventory + last cycle)
        run: |
          mkdir -p knowledge inventory leads reports
          [ -f knowledge/index.md ] || echo "# Knowledge Base (seed)" > knowledge/index.md
          [ -f state_${MODEL_NAME}.json ] || echo '{"phase":"RECON","target":"api"}' > state_${MODEL_NAME}.json
          TARGET=$(python3 -c "import json;print(json.load(open('state_${MODEL_NAME}.json')).get('target','api'))")
          echo "TARGET=$TARGET" >> $GITHUB_ENV
          # Advance the rotation NOW and persist it to the state file that
          # gets uploaded as this job's artifact -- the aggregate job copies
          # it back to the repo root and commits it, so next cycle actually
          # sees the new target (previously computed as TARGET_NEXT and then
          # discarded: never written anywhere, never uploaded, never committed).
          python3 -c "
          import json
          rotation = {'api': 'app', 'app': 'sdk', 'sdk': 'gladia', 'gladia': 'api'}
          p = 'state_${MODEL_NAME}.json'
          st = json.load(open(p))
          st['target'] = rotation.get(st.get('target', 'api'), 'api')
          json.dump(st, open(p, 'w'))
          "
          {
            echo "=== KNOWLEDGE BASE ==="
            cat knowledge/index.md
            echo "=== MY STATE ==="
            cat state_${MODEL_NAME}.json
            echo "=== MY LAST LEADS (tail) ==="
            tail -60 leads/lead-${MODEL_NAME}.md 2>/dev/null || echo none
            echo "=== AGGREGATED HYPOTHESES (tail) ==="
            tail -40 reports/hypotheses.md 2>/dev/null || echo none
            echo "=== INVENTORY gladia ==="
            tail -50 inventory/gladia.md 2>/dev/null || echo none
          } > ctx.txt

      - name: OpenAPI structural diff (deterministic, feeds analyst prompt)
        run: |
          curl -s --max-time 20 https://api.gladia.io/openapi.json -o openapi-live.json || echo '{}' > openapi-live.json
          python3 << 'PY_EOF'
          import json
          def load(path):
              try:
                  return json.load(open(path))
              except Exception:
                  return {}
          live = load('openapi-live.json')
          snap = load('knowledge/openapi-snapshot.json')
          def summarize(spec):
              paths = set((spec.get('paths') or {}).keys())
              webhooks = set((spec.get('webhooks') or {}).keys())
              params = {}
              for p, methods in (spec.get('paths') or {}).items():
                  if not isinstance(methods, dict): continue
                  for m, op in methods.items():
                      if not isinstance(op, dict): continue
                      names = tuple(sorted(pr.get('name', '') for pr in op.get('parameters', []) if isinstance(pr, dict)))
                      params[f'{m.upper()} {p}'] = names
              return paths, webhooks, params
          lp, lw, lpar = summarize(live)
          sp, sw, spar = summarize(snap)
          lines = []
          for p in sorted(lp - sp): lines.append(f'[+PATH] {p}')
          for p in sorted(sp - lp): lines.append(f'[-PATH] {p}')
          for w in sorted(lw - sw): lines.append(f'[+WEBHOOK] {w}')
          for w in sorted(sw - lw): lines.append(f'[-WEBHOOK] {w}')
          for k in sorted(set(lpar) & set(spar)):
              if lpar[k] != spar[k]:
                  lines.append(f'[~PARAMS] {k}: {spar[k]} -> {lpar[k]}')
          with open('openapi-delta.txt', 'w') as f:
              if lines:
                  f.write('=== OPENAPI SPEC DELTA (structural, machine-diffed) ===\n')
                  f.write('OPENAPI SPEC CHANGED since last committed snapshot:\n' + '\n'.join(lines) + '\n')
              elif not lp:
                  f.write('=== OPENAPI SPEC DELTA (structural, machine-diffed) ===\nOPENAPI SPEC: fetch failed or empty this cycle, no diff possible\n')
              else:
                  f.write('=== OPENAPI SPEC DELTA (structural, machine-diffed) ===\n')
                  f.write(f'OPENAPI SPEC: NO_DRIFT (structurally identical to last snapshot: {len(lp)} paths, {len(lw)} webhooks)\n')
          PY_EOF
          cat openapi-delta.txt >> ctx.txt

      - name: Analyst run (8-step methodology)
        run: |
          cat ctx.txt > analyst-prompt.txt
          cat >> analyst-prompt.txt << 'PROMPT_EOF'
          You are a senior bug bounty hunter ANALYST for the Gladia program. Scope:
          MAX MODE (1M ctx): dig DEEPER + FASTER. Directives:
          - Hunt HIGH-VALUE classes first: broken auth/session handling, IDOR/BOLA, SSRF-to-cloud-metadata (169.254.169.254), mass assignment, JWT alg/key confusion, OAuth redirect_uri/state flaws, business logic on money/auth flows, file upload, GraphQL introspection+mutations.
          - CHAIN primitives aggressively: open redirect -> OAuth code theft -> ATO; XSS -> session theft -> ATO; IDOR -> cross-tenant PII dump; SSRF -> metadata -> keys. One chained lead beats ten weak ones.
          - Request-level reasoning only: exact METHOD path + params + headers + body, expected vs actual status codes. No prose filler, no restating context.
          - Breadth pass over the FULL inventory for anomalies (odd status codes, interesting param names like id/uid/email/user_id, versioned APIs /api/v1|v2|beta|internal, debug/test flags, swagger/openapi/json exposure), then depth on top-3 anomalies this cycle.
          - If a hypothesis needs live confirmation you cannot do passively, emit [NEXT] PROBE with the EXACT read-only request so the next cycle executes it immediately.
          api.gladia.io (HIGHEST), app.gladia.io (HIGH), official SDKs on npm/PyPI
          (@gladiaio/sdk, gladiaio-sdk) (MEDIUM), gladia.io (LOW). OUT OF SCOPE:
          all other *.gladia.io subdomains, third-party services, social engineering,
          physical security, DoS/DDoS, non-Gladia assets, physical access, and any
          automated-scanner output without manual validation. Your job is NOT to
          invent vulnerabilities. Run these 8 steps and output ONLY the structured blocks.

          STEP 1 — DELTA: Compare the inventory + knowledge + your last leads against the current known surface (including the OPENAPI SPEC DELTA block below, which is machine-diffed -- trust it over your own byte-counting). List only NEW or CHANGED surface items as [NEW]/[CHANGED] (one line each). If nothing is new, state "NO_DELTA".

          STEP 2 — PRIORITIZE: Score the top new assets (or top existing if no delta) on 6 axes 0-10: attack_surface, business_value, tech_exposure (GraphQL/OAuth/JWT/upload/admin/uncommon stacks), gate_ease (10 = no auth needed), cloud_surface (cloud APIs/storage/metadata), freshness. priority = 0.25*attack + 0.25*business + 0.15*tech + 0.15*gate + 0.10*cloud + 0.10*fresh. Emit [PRIO] lines: asset, score, axis breakdown.

          STEP 3 — HYPOTHESES: For the top 3 prioritized assets emit max 1 hypothesis each, strictly this schema:
          [HYP] <title>
          class: <IDOR|SSRF|AUTH|XSS|BUSLOGIC|MISCONFIG|OAUTH|OTHER>
          asset: <host/endpoint>
          confidence: <0-100>
          reasoning: <facts only, 2-3 lines>
          evidence_needed: <what proves it>
          verify_steps: <passive-first concrete HTTP requests, or AUTH_HELPED:...>
          impact: <what attacker gets + severity>
          testability: <PASSIVE|AUTH_HELPED|HUMAN_ONLY>

          HARD FORMAT RULE: one field per line. NEVER put confidence/class/asset inline
          inside the [HYP] title line (e.g. no "[HYP] foo: confidence 96, class MISCONFIG").
          Every field MUST be on its own line as 'key: value' directly under the [HYP] line.
          If you only have a partial hypothesis, still emit the [HYP] line with whatever
          fields you have on separate lines — never inline. Always spell class as OAUTH,
          never OATH, and spell asset as the full hostname (api.gladia.io / app.gladia.io),
          never a bare short form -- these get merged into a shared knowledge base by exact
          key match, and inconsistent spelling breaks that dedup.

          STEP 4 — SELF-CRITIQUE: Re-read your own hypotheses. Drop any that: confidence < 40, or class on the knowledge REJECTED list, or no concrete verify_steps. For dropped ones emit [PARKED] <title>: <why dropped>. Emit [FINAL] with the surviving hypotheses re-ranked (top first).

          STEP 5 — NEXT ACTION: Choose exactly one and emit [NEXT] <PROBE|SCAN|RAG|HUMAN>: <one concrete action, with the exact endpoint/request if PROBE, or the authorized-token test if HUMAN>.

          STEP 6 — LEARNING: Emit [LEARN] lines for any class newly proven dead or alive (one line each, format: REJECTED/ACCEPTED <class> @ <asset>: <reason>).

          STEP 7 — RISK SCORE: Emit [RISK] api.gladia.io: <0-100> reason | app.gladia.io: <0-100> reason | sdk: <0-100> reason (overall exposure of the program surface, not exploit status).

          RULES: facts vs hypotheses strictly separated; no endpoint-map-only output; no class on the REJECTED list; never mention secrets in full (hash them with sha256sum); all claims must trace to the context provided or your own read-only probes; passive-first only (≤1 rps, GET/HEAD); any scanner output requires manual validation before it becomes a lead.
          PROMPT_EOF
          echo "" >> analyst-prompt.txt
          echo "ROTATION FOCUS THIS CYCLE: $TARGET — at least one of your top-3 STEP 3 hypotheses must concretely target ${TARGET}'s surface (api=api.gladia.io / app=app.gladia.io / sdk=npm+PyPI SDKs / gladia=gladia.io marketing site) even if the STEP 1 breadth pass surfaces other anomalies elsewhere. Rotation exists so every asset gets deliberate deep-dive attention over time instead of always the same familiar surface. If $TARGET truly has nothing new to add beyond what's already ACCEPTED/REJECTED in the knowledge base, say so explicitly with [LEARN] ACCEPTED OTHER @ $TARGET: no new surface this cycle, re-confirmed static." >> analyst-prompt.txt
          export PATH="$HOME/.opencode/bin:$HOME/.local/bin:$HOME/.npm-global/bin:$PATH"
          timeout -k 15 20m opencode run --model "$MODEL_ID" < analyst-prompt.txt > analyst-out.txt 2>&1 || true
          # Model-error guard: opencode masks backend failures behind exit 0 (|| true above),
          # so a deprecated/unavailable model silently produces an empty lead while the job stays
          # green (this is exactly how muse-spark-1.2 broke unnoticed). Surface it loudly.
          if grep -qiE '"name":[[:space:]]*"UnknownError"|Unexpected server error|Internal server error|FreeTierError|Model .* (is not supported|is unavailable)' analyst-out.txt; then
            echo "::warning title=opencode model error::MODEL_ID=$MODEL_ID returned a gateway error; this analyst produced no lead this cycle. Check the model is a live, non-deprecated free model at https://opencode.ai/zen/v1/models"
          fi
          cp analyst-out.txt analyst-${MODEL_NAME}.out
          grep -E '^\[(NEW|CHANGED|PRIO|HYP|PARKED|FINAL|NEXT|LEARN|RISK)\]|^class:|^confidence:|^asset:|^impact:|^testability:|^verify_steps:|^reasoning:|^evidence_needed:' analyst-out.txt > lead.txt || true
          {
            echo "## $(date -u +'%Y-%m-%d %H:%M:%S UTC') [$TARGET] (model ${MODEL_NAME})"
            cat lead.txt
          } > lead_${MODEL_NAME}.txt
          echo "lead bytes: $(wc -c < lead.txt) | raw bytes: $(wc -c < analyst-out.txt)"

      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: analyst-${{ matrix.model.name }}
          path: |
            lead_${{ matrix.model.name }}.txt
            analyst-${{ matrix.model.name }}.out
            ctx.txt
            state_${{ matrix.model.name }}.json
            openapi-live.json
          if-no-files-found: warn

  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: analyst
    if: always()
    concurrency:
      group: hunt-aggregate
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download all model artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          path: art
          merge-multiple: true

      - name: Promote per-model state + OpenAPI snapshot from artifacts
        run: |
          mkdir -p knowledge
          # This is the fix for the target-rotation persistence bug: the
          # analyst job already advanced state_<model>.json's target field,
          # but that only exists in its ephemeral runner unless copied here
          # and committed below.
          cp art/state_*.json . 2>/dev/null || true
          if [ -s art/openapi-live.json ] && [ "$(cat art/openapi-live.json)" != "{}" ]; then
            cp art/openapi-live.json knowledge/openapi-snapshot.json
          fi

      - name: Merge + rank + inventory + knowledge update (single committer)
        run: |
          mkdir -p leads reports knowledge inventory
          for f in art/lead_*.txt; do
            [ -f "$f" ] || continue
            cat "$f" >> leads/lead-$(basename "$f" | sed -E 's/lead_([a-z0-9]+)\.txt/\1/').md
          done
          python3 << 'PY_EOF'
          import re, glob, json, os, datetime, hashlib, subprocess
          stamp = datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%d %H:%M:%S UTC')
          # per-model structured files for the aggregator
          for f in glob.glob('art/lead_*.txt'):
              base = os.path.basename(f)
              model = re.sub(r'^lead_([a-z0-9]+)\.txt$', r'\1', base)
              open(f'reports/hypotheses-{model}.txt', 'w').write(open(f).read())
          all_h = []
          for f in glob.glob('reports/hypotheses-*.txt'):
              text = open(f).read()
              m = re.search(r'^\[HYP\] (.*)$', text, re.M)
              if not m: continue
              title = m.group(1).strip()
              c = re.search(r'^confidence:\s*(\d+)', text, re.M)
              a = re.search(r'^asset:\s*(\S+)', text, re.M)
              all_h.append((int(c.group(1)) if c else 0, a.group(1) if a else '?', title, f))
          all_h.sort(reverse=True)

          # Ranked hypotheses: only append a new block if the ranked set
          # actually changed since last cycle (previously appended
          # unconditionally every cycle, which is how this file hit 1.6MB
          # of near-identical restatements -- see reports/hypotheses.archive-2026-09.md).
          seen = set()
          body_lines = []
          for conf, asset, title, f in all_h[:8]:
              key = title.lower()[:60]
              if key in seen: continue
              seen.add(key)
              body_lines.append(f"- [{conf}] {asset}: {title}")
          for f in glob.glob('reports/hypotheses-*.txt'):
              n = re.search(r'^\[NEXT\] (.*)$', open(f).read(), re.M)
              if n: body_lines.append(f"- NEXT({os.path.basename(f)}): {n.group(1).strip()[:160]}")
          for f in glob.glob('reports/hypotheses-*.txt'):
              for l in re.findall(r'^\[LEARN\] (.*)$', open(f).read(), re.M):
                  body_lines.append(f"- LEARN: {l.strip()[:160]}")
          block_body = '\n'.join(body_lines)
          hash_path = 'reports/.hypotheses-last-hash'
          prior_hash = open(hash_path).read().strip() if os.path.exists(hash_path) else ''
          cur_hash = hashlib.sha1(block_body.encode()).hexdigest()
          if block_body and cur_hash != prior_hash:
              with open('reports/hypotheses.md', 'a') as out:
                  out.write(f"\n## RANKED HYPOTHESES {stamp}\n{block_body}\n")
              open(hash_path, 'w').write(cur_hash)

          # knowledge upsert (structured facts.json, deduped by class@asset --
          # see scripts/knowledge_upsert.py for why the old naive
          # "if line not in ktext: append" approach was replaced)
          learn_text = '\n'.join(
              f'[LEARN] {l}'
              for f in glob.glob('reports/hypotheses-*.txt')
              for l in re.findall(r'^\[LEARN\] (.*)$', open(f).read(), re.M)
          )
          if learn_text:
              subprocess.run(['python3', 'scripts/knowledge_upsert.py'], input=learn_text, text=True)

          # inventory update
          inv = 'inventory/gladia.md'
          with open(inv, 'a') as io:
              io.write(f"\n## {stamp}\n")
              for f in glob.glob('reports/hypotheses-*.txt'):
                  for l in re.findall(r'^\[(NEW|CHANGED)\] (.*)$', open(f).read(), re.M):
                      io.write(f"- {l[0]} {l[1].strip()[:200]}\n")

          # phase advance per model (target rotation already advanced by the
          # analyst job itself; this only progresses the RECON->POC phase)
          for sp in glob.glob('state_*.json'):
              try:
                  st = json.load(open(sp))
              except Exception:
                  st = {}
              phases = ['RECON', 'SURFACE', 'HYPOTHESIS', 'POC']
              if st.get('phase') in phases:
                  st['phase'] = phases[min(phases.index(st['phase']) + 1, 3)]
              json.dump(st, open(sp, 'w'))

          # archive raw logs
          for f in glob.glob('art/analyst-*.out'):
              model = re.search(r'art/analyst-([a-z0-9]+)\.out$', f)
              if model:
                  with open(f'reports/analyst-{model.group(1)}.log', 'a') as lg:
                      lg.write(f"===== ANALYST {model.group(1)} {stamp} =====\n")
                      lg.write(open(f, errors='ignore').read())
          print('merged', len(all_h), 'hypotheses')
          PY_EOF


      - name: Run passive verifier on hypotheses (read-only)
        shell: bash
        run: |
          python3 << 'ROBOT_PY'
          import re, glob, ssl, urllib.request, os, time, json, base64

          allow = os.environ.get('PROBE_ALLOW', '').lower()
          pat = re.compile(r'https://[^\s"\)\]\}]+')
          urls, seen = [], set()
          for f in glob.glob('art/lead_*.txt') + glob.glob('lead_*.txt') + glob.glob('raw_*.txt') + glob.glob('analyst-*.out'):
            try: txt = open(f, errors='ignore').read()
            except OSError: continue
            for m in pat.findall(txt):
              u = m.strip('.,;)]}>')
              if u in seen: continue
              seen.add(u)
              if allow and not any(a in u.lower() for a in allow.split('|')): continue
              urls.append(u[:300])

          ctx = ssl.create_default_context()
          rows = []
          bodies = []
          for u in urls[:12]:
            try:
              req = urllib.request.Request(u, method='GET', headers={'User-Agent': 'Mozilla/5.0 (passive verifier)'})
              with urllib.request.urlopen(req, timeout=12, context=ctx) as r:
                body = r.read(20000)
                bodies.append(body.decode('utf-8', 'ignore'))
                rows.append('%s -> %s len=%s type=%s' % (u, r.status, r.headers.get('Content-Length', '?'), r.headers.get('Content-Type', '')[:40]))
            except urllib.error.HTTPError as e:
              rows.append('%s -> HTTP %s' % (u, e.code))
              try:
                bodies.append(e.read(20000).decode('utf-8', 'ignore'))
              except Exception:
                pass
            except Exception as e:
              rows.append('%s -> ERR %s' % (u, str(e)[:50]))
          print('\n'.join(rows) if rows else 'no probes (allow=%s)' % allow)

          # --- GraphQL introspection probe: single passive schema-name-only
          # query per candidate path, 1 rps, read-only (no mutations sent) ---
          gql_rows = []
          gql_query = json.dumps({'query': '{__schema{queryType{name}}}'}).encode()
          for host in ('api.gladia.io', 'app.gladia.io'):
            for path in ('/graphql', '/v2/graphql', '/api/graphql'):
              u = f'https://{host}{path}'
              try:
                req = urllib.request.Request(u, data=gql_query, method='POST',
                                              headers={'User-Agent': 'Mozilla/5.0 (passive verifier)', 'Content-Type': 'application/json'})
                with urllib.request.urlopen(req, timeout=8, context=ctx) as r:
                  body = r.read(2000).decode('utf-8', 'ignore')
                  live = '__schema' in body or 'queryType' in body
                  gql_rows.append('%s -> %s introspection_live=%s' % (u, r.status, live))
              except urllib.error.HTTPError as e:
                gql_rows.append('%s -> HTTP %s' % (u, e.code))
              except Exception as e:
                gql_rows.append('%s -> ERR %s' % (u, str(e)[:50]))
              time.sleep(1)

          # --- JWT structural check: decode only (never verify/forge) ---
          jwt_rows = []
          jwt_pat = re.compile(r'eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}')
          extra_text = '\n'.join(open(f, errors='ignore').read() for f in glob.glob('art/lead_*.txt') + glob.glob('art/analyst-*.out'))
          corpus = '\n'.join(bodies) + '\n' + extra_text
          seen_jwt = set()
          for tok in jwt_pat.findall(corpus):
            if tok in seen_jwt: continue
            seen_jwt.add(tok)
            try:
              header_b64 = tok.split('.')[0]
              header_b64 += '=' * (-len(header_b64) % 4)
              header = json.loads(base64.urlsafe_b64decode(header_b64))
              alg = str(header.get('alg', '')).lower()
              if alg in ('none', ''):
                flag = ' <== CRITICAL: alg=none (unsigned token, likely auth bypass)'
              elif alg == 'hs256':
                flag = ' <== verify this issuer never also signs RS256 (HS256/RS256 key-confusion candidate)'
              else:
                flag = ''
              jwt_rows.append('JWT header %s%s' % (header, flag))
            except Exception as e:
              jwt_rows.append('JWT decode failed: %s' % str(e)[:50])

          with open('probe-results.md', 'a') as fo:
            fo.write('\n## %s\n%s\n' % (time.strftime('%Y-%m-%d %H:%M:%S UTC', time.gmtime()), '\n'.join(rows)))
            if gql_rows:
              fo.write('### GraphQL introspection probe\n%s\n' % '\n'.join(gql_rows))
            if jwt_rows:
              fo.write('### JWT structural findings\n%s\n' % '\n'.join(jwt_rows))
          print('\n'.join(gql_rows))
          print('\n'.join(jwt_rows) if jwt_rows else 'no JWTs observed this cycle')
          ROBOT_PY

      - name: Commit (single push, no race)
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          grep -rlE 'AIza[A-Za-z0-9_-]{30,}' --include='*.md' --include='*.json' --include='*.txt' . | xargs -r sed -i -E 's/(AIza[A-Za-z0-9_-]{6})[A-Za-z0-9_-]{24,}/\1_REDACTED/g' || true
          git add leads reports knowledge inventory state_*.json probe-results.md || true
          if ! git diff --cached --quiet; then
            git commit -m "analyst cycle $(date -u +'%Y-%m-%d-%H-%M')"
          fi
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && break
            echo "commit push attempt $i failed, retrying in 20s..."
            sleep 20
          done
          git log --oneline -1

      - name: Dispatch reposcan (once per cycle)
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/reposcan.yml/dispatches" \
            -d '{"ref":"main"}' || true
